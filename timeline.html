<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galami Labs — three steps</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#111; --muted:#6a6a6a; --line:#dedcd7; --bg:#f7f6f3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100dvh; display: flex; flex-direction: column;
    }
    header { padding: 2.5rem 1.5rem 0; text-align: center; }
    .mark { font-family: Fraunces, Georgia, serif; font-size: 1.05rem; }
    h1 { font-family: Fraunces, Georgia, serif; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -0.03em; margin: 0.7rem 0 0.4rem; }
    .lead { color: var(--muted); font-size: 0.98rem; }
    .rail-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 3rem 1.25rem 2rem; }
    .rail {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
    }
    .rail::before {
      content: "";
      position: absolute;
      left: 16%; right: 16%;
      top: 11px;
      height: 1px;
      background: var(--line);
    }
    .node { background: none; border: 0; cursor: pointer; text-align: center; font: inherit; color: inherit; padding: 0 0.4rem; }
    .dot {
      width: 22px; height: 22px; margin: 0 auto 1rem;
      border-radius: 50%; border: 1px solid #111;
      background: #fff; position: relative; z-index: 1;
    }
    .node.on .dot { background: #111; }
    .node.tbd .dot { border-color: #bbb; background: var(--bg); }
    .num { display: block; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
    .title { font-family: Fraunces, Georgia, serif; font-size: 1.15rem; line-height: 1.25; }
    .node.tbd .title { color: #8a8a8a; }
    .panel {
      max-width: 420px; margin: 2.75rem auto 0;
      min-height: 6.5rem; text-align: center;
    }
    .panel p { color: var(--muted); line-height: 1.65; font-size: 1rem; }
    footer { text-align: center; padding: 0 1rem 2rem; font-size: 0.85rem; color: #999; }
    footer a { color: #666; text-decoration: none; }
    @media (max-width: 560px) {
      .title { font-size: 0.95rem; }
      .rail::before { left: 18%; right: 18%; }
    }
  </style>
</head>
<body>
  <header>
    <p class="mark">Galami Labs</p>
    <h1>Three steps.</h1>
    <p class="lead">Learn it. Make it. Take it to work.</p>
  </header>
  <div class="rail-wrap">
    <div class="rail" id="rail">
      <button class="node on" type="button" data-i="0">
        <div class="dot"></div>
        <span class="num">01</span>
        <span class="title">Learn the tools</span>
      </button>
      <button class="node tbd" type="button" data-i="1">
        <div class="dot"></div>
        <span class="num">02</span>
        <span class="title">Make the tools</span>
      </button>
      <button class="node tbd" type="button" data-i="2">
        <div class="dot"></div>
        <span class="num">03</span>
        <span class="title">Bring them in</span>
      </button>
    </div>
    <div class="panel" id="panel">
      <p>I will use today’s AI on actual tasks — research, writing, follow-up — until I can trust the result. Practice, not a course. This is the current step.</p>
    </div>
  </div>
  <footer><a href="index.html">All versions</a></footer>
  <script>
    const copy = [
      'Use AI on real work until I trust it. This is now.',
      'Turn that into small programs a business can actually click.',
      'Walk them into companies I already know. That is the firm.'
    ];
    const nodes = [...document.querySelectorAll('.node')];
    const panel = document.getElementById('panel');
    nodes.forEach((btn) => {
      btn.addEventListener('click', () => {
        nodes.forEach((n) => n.classList.remove('on'));
        btn.classList.add('on');
        panel.querySelector('p').textContent = copy[+btn.dataset.i];
      });
    });
  </script>
</body>
</html>
